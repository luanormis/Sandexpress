steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--tag', 'gcr.io/$PROJECT_ID/sandexpress-staging:$COMMIT_SHA',
           '--build-arg', 'NEXT_PUBLIC_ENV=staging',
           '--build-arg', 'NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL}',
           '--build-arg', 'NEXT_PUBLIC_SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY}',
           '--build-arg', 'NEXT_PUBLIC_APP_URL=${_APP_URL}', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/sandexpress-staging:$COMMIT_SHA']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: ['run', 'deploy', 'sandexpress-staging',
           '--image=gcr.io/$PROJECT_ID/sandexpress-staging:$COMMIT_SHA',
           '--region=us-central1', '--platform=managed', '--allow-unauthenticated',
           '--memory=512Mi', '--cpu=1', '--min-instances=0', '--max-instances=3',
           '--set-env-vars=NEXT_PUBLIC_ENV=staging,NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL},NEXT_PUBLIC_SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY},NEXT_PUBLIC_APP_URL=${_APP_URL},SUPABASE_SERVICE_ROLE_KEY=${_SERVICE_ROLE_KEY},ADMIN_PASSWORD=${_ADMIN_PASSWORD},SESSION_SECRET=${_SESSION_SECRET},META_WHATSAPP_PHONE_NUMBER_ID=${_META_WHATSAPP_PHONE_NUMBER_ID},META_WHATSAPP_ACCESS_TOKEN=${_META_WHATSAPP_ACCESS_TOKEN},META_GRAPH_API_VERSION=${_META_GRAPH_API_VERSION},META_WHATSAPP_OTP_TEMPLATE_NAME=${_META_WHATSAPP_OTP_TEMPLATE_NAME},META_WHATSAPP_OTP_TEMPLATE_LANGUAGE=${_META_WHATSAPP_OTP_TEMPLATE_LANGUAGE},OTP_PEPPER=${_OTP_PEPPER},OTP_TTL_SECONDS=${_OTP_TTL_SECONDS},RESEND_API_KEY=${_RESEND_API_KEY},EMAIL_FROM=${_EMAIL_FROM},ADMIN_RECOVERY_EMAIL=${_ADMIN_RECOVERY_EMAIL}']
substitutions:
  _SUPABASE_URL: ''
  _SUPABASE_ANON_KEY: ''
  _APP_URL: ''
  _SERVICE_ROLE_KEY: ''
  _ADMIN_PASSWORD: ''
  _SESSION_SECRET: ''
  _META_WHATSAPP_PHONE_NUMBER_ID: ''
  _META_WHATSAPP_ACCESS_TOKEN: ''
  _META_GRAPH_API_VERSION: 'v25.0'
  _META_WHATSAPP_OTP_TEMPLATE_NAME: 'sandexpress_otp_ptbr'
  _META_WHATSAPP_OTP_TEMPLATE_LANGUAGE: 'pt_BR'
  _OTP_PEPPER: ''
  _OTP_TTL_SECONDS: '300'
  _RESEND_API_KEY: ''
  _EMAIL_FROM: ''
  _ADMIN_RECOVERY_EMAIL: ''
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: '1200s'
